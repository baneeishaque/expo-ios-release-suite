# Generated by scripts/render-workflow.mjs. Edit this template instead.
name: Reusable Expo iOS Release
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
      target:
        type: string
        default: simulator
      profile:
        type: string
        default: ''
      submit:
        type: boolean
        default: false
      release-branch:
        type: string
        default: main
      expected-bundle-id:
        type: string
        default: ''
      expected-project-id:
        type: string
        default: ''
      expected-owner:
        type: string
        default: ''
      node-version:
        type: string
        default: '22'
      xcode-version:
        type: string
        default: '26.4.1'
      eas-version:
        type: string
        default: '27.5.0'
      simulator-runner:
        type: string
        default: macos-26
      device-runner:
        type: string
        default: ubuntu-24.04
      simulator-timeout:
        type: number
        default: 60
      device-timeout:
        type: number
        default: 180
      prebuild:
        type: boolean
        default: true
      scheme:
        type: string
        default: ''
      device-profile:
        type: string
        default: device
      production-profile:
        type: string
        default: production
      artifact-prefix:
        type: string
        default: ios
      simulator-retention-days:
        type: number
        default: 14
      device-retention-days:
        type: number
        default: 30
      eas-wait-seconds:
        type: number
        default: 9000
      eas-poll-seconds:
        type: number
        default: 60
      asc-app-id:
        type: string
        default: ''
    secrets:
      expo-token:
        required: false
      asc-key-id:
        required: false
      asc-issuer-id:
        required: false
      asc-key:
        required: false
      public-env:
        required: false
    outputs:
      simulator-artifact-url:
        description: Simulator app artifact URL when requested.
        value: ${{ jobs.simulator.outputs.artifact-url }}
      ipa-artifact-url:
        description: EAS IPA artifact URL when built.
        value: ${{ jobs.device.outputs.artifact-url }}
      submitted:
        description: True only after successful submission.
        value: ${{ jobs.device.outputs.submitted }}
      production-build-id:
        description: Exact production EAS build ID.
        value: ${{ jobs.device.outputs.production-build-id }}
      production-build-number:
        description: Exact production build number for post-submission automation.
        value: ${{ jobs.device.outputs.production-build-number }}
      production-app-version:
        description: App version for the submitted build.
        value: ${{ jobs.device.outputs.production-app-version }}
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ${{ inputs.simulator-runner }}
    timeout-minutes: ${{ inputs.simulator-timeout }}
    outputs:
      eas: ${{ steps.simulator.outputs.eas }}
      profile: ${{ steps.simulator.outputs.profile }}
      submit: ${{ steps.simulator.outputs.submit }}
      artifact-url: ${{ steps.simulator.outputs.artifact-url }}
    steps:
      - name: Check Out Caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Simulator
        id: simulator
        uses: Baneeishaque/expo-ios-release-suite/simulator@9073e6ab83b006d1fbc127e1e9b95e2f73dd6fe0
        with:
          working-directory: ${{ inputs.working-directory }}
          target: ${{ inputs.target }}
          profile: ${{ inputs.profile }}
          submit: ${{ inputs.submit }}
          release-branch: ${{ inputs.release-branch }}
          expected-bundle-id: ${{ inputs.expected-bundle-id }}
          expected-project-id: ${{ inputs.expected-project-id }}
          expected-owner: ${{ inputs.expected-owner }}
          node-version: ${{ inputs.node-version }}
          xcode-version: ${{ inputs.xcode-version }}
          prebuild: ${{ inputs.prebuild }}
          scheme: ${{ inputs.scheme }}
          public-env: ${{ secrets.public-env || '{}' }}
          artifact-prefix: ${{ inputs.artifact-prefix }}
          retention-days: ${{ inputs.simulator-retention-days }}
  device:
    needs: simulator
    if: needs.simulator.outputs.eas == 'true'
    runs-on: ${{ inputs.device-runner }}
    timeout-minutes: ${{ inputs.device-timeout }}
    outputs:
      artifact-url: ${{ steps.eas.outputs.artifact-url }}
      submitted: ${{ steps.eas.outputs.submitted }}
      production-build-id: ${{ steps.eas.outputs.production-build-id }}
      production-build-number: ${{ steps.eas.outputs.production-build-number }}
      production-app-version: ${{ steps.eas.outputs.production-app-version }}
    steps:
      - name: Check Out Caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build And Submit
        id: eas
        uses: Baneeishaque/expo-ios-release-suite/eas@9073e6ab83b006d1fbc127e1e9b95e2f73dd6fe0
        with:
          working-directory: ${{ inputs.working-directory }}
          simulator-result: ${{ needs.simulator.result }}
          profile: ${{ needs.simulator.outputs.profile }}
          submit: ${{ needs.simulator.outputs.submit }}
          device-profile: ${{ inputs.device-profile }}
          production-profile: ${{ inputs.production-profile }}
          expected-bundle-id: ${{ inputs.expected-bundle-id }}
          expected-project-id: ${{ inputs.expected-project-id }}
          expected-owner: ${{ inputs.expected-owner }}
          node-version: ${{ inputs.node-version }}
          eas-version: ${{ inputs.eas-version }}
          wait-seconds: ${{ inputs.eas-wait-seconds }}
          poll-seconds: ${{ inputs.eas-poll-seconds }}
          artifact-prefix: ${{ inputs.artifact-prefix }}
          retention-days: ${{ inputs.device-retention-days }}
          public-env: ${{ secrets.public-env || '{}' }}
          expo-token: ${{ secrets.expo-token }}
          asc-app-id: ${{ inputs.asc-app-id }}
          asc-key-id: ${{ secrets.asc-key-id }}
          asc-issuer-id: ${{ secrets.asc-issuer-id }}
          asc-key: ${{ secrets.asc-key }}
